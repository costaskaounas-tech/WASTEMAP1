name: Build DISPATCHER Android

on:
  push:
    branches:
      - dispatcher-android
    paths-ignore:
      - "DISPATCHER-Android/gradle/**"
      - "DISPATCHER-Android/gradlew"
      - "DISPATCHER-Android/gradlew.bat"
      - "DISPATCHER-Android/release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dispatcher-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: dispatcher-android
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: gradle -p DISPATCHER-Android wrapper --gradle-version 9.6.0

      - name: Test and build APK
        run: |
          DISPATCHER-Android/gradlew -p DISPATCHER-Android             :app:testDebugUnitTest :app:assembleDebug             --no-daemon --stacktrace

      - name: Prepare downloads
        run: |
          mkdir -p DISPATCHER-Android/release
          cp DISPATCHER-Android/app/build/outputs/apk/debug/app-debug.apk             DISPATCHER-Android/release/DISPATCHER-1.0.0-debug.apk
          cd DISPATCHER-Android
          zip -r release/DISPATCHER-Android-Studio.zip .             -x ".gradle/*" "app/build/*" "build/*" "release/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dispatcher-android-build
          path: |
            DISPATCHER-Android/release/DISPATCHER-1.0.0-debug.apk
            DISPATCHER-Android/release/DISPATCHER-Android-Studio.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish generated downloads to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             DISPATCHER-Android/gradle             DISPATCHER-Android/gradlew             DISPATCHER-Android/gradlew.bat             DISPATCHER-Android/release
          if ! git diff --cached --quiet; then
            git commit -m "Build DISPATCHER Android APK [skip ci]"
            git push origin HEAD:dispatcher-android
          fi
